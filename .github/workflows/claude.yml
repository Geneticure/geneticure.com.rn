name: Claude Assistant
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Agent mode runs on every matching event, so gate the job on the trigger
    # phrase ourselves instead of relying on the action's tag-mode detection.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_PR_TOKEN || github.token }}

      - uses: anthropics/claude-code-action@v1
        env:
          # `gh pr create` reads GH_TOKEN, so it needs the PR-capable token too.
          GH_TOKEN: ${{ secrets.CLAUDE_PR_TOKEN || github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.CLAUDE_PR_TOKEN || github.token }}
          # Supplying `prompt` puts the action in agent mode.
          prompt: |
            Repository: ${{ github.repository }}
            Issue/PR number: ${{ github.event.issue.number || github.event.pull_request.number }}
            Default branch: ${{ github.event.repository.default_branch }}

            Carry out the request in the triggering issue body or comment.

            If the request requires code changes, you must open the pull
            request yourself. Do not stop after pushing a branch:
              1. Commit the changes to a new branch.
              2. Push it:  git push origin HEAD
              3. Open the PR:
                   gh pr create \
                     --base "${{ github.event.repository.default_branch }}" \
                     --head "$(git branch --show-current)" \
                     --title "<short title>" \
                     --body "<what changed and why; include 'Closes #<issue number>'>"
              4. Report the URL of the pull request you opened.

            Never leave a pushed branch without an open pull request.
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*)"
